name: Release

# Build httpserver release binaries for each platform and attach them to
# the GitHub Release for a pushed version tag -- the same pattern
# qrazil/m31's own release.yml uses, against a pinned release of that repo
# (see test.yml's own comment for why: this app needs the m31 runtime
# SDK -- config.sh + runtime/ -- bundled in that release, not just the
# compiler, since there is no pre-built runtime library to link against).
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# test.yml is a hard precondition, exactly as qrazil/m31's own release.yml
# treats its gates job: a broken build must never produce a release.
env:
  M31_REF: v0.1.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release needs this to create the release and upload assets

jobs:
  test:
    name: Test (precondition)
    uses: ./.github/workflows/test.yml

  build-linux-x86_64:
    name: Build — Linux x86-64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o m31.tar.gz \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-linux-x86_64.tar.gz"
          mkdir -p m31
          tar -C m31 -xzf m31.tar.gz
          chmod +x m31/m31c
          echo "LANGC=$PWD/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$PWD/m31" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          OUT=dist/httpserver-linux-x86_64
          mkdir -p "$OUT"
          OUT="$OUT/httpserver" bash build.sh
          cp README.md BENCHMARK.md SCALING.md "$OUT/" 2>/dev/null || true
          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          httpserver — Linux x86-64 release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}
          Built against m31 ${{ env.M31_REF }}

          httpserver                   ./httpserver --port 8080 --host 0.0.0.0
          EOF

      - name: Package
        run: tar -C "dist/httpserver-linux-x86_64" -czf httpserver-linux-x86_64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: httpserver-linux-x86_64
          path: httpserver-linux-x86_64.tar.gz
          if-no-files-found: error

  build-linux-aarch64:
    name: Build — Linux aarch64
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o m31.tar.gz \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-linux-aarch64.tar.gz"
          mkdir -p m31
          tar -C m31 -xzf m31.tar.gz
          chmod +x m31/m31c
          echo "LANGC=$PWD/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$PWD/m31" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          OUT=dist/httpserver-linux-aarch64
          mkdir -p "$OUT"
          OUT="$OUT/httpserver" bash build.sh
          cp README.md BENCHMARK.md SCALING.md "$OUT/" 2>/dev/null || true
          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          httpserver — Linux aarch64 release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}
          Built against m31 ${{ env.M31_REF }}

          httpserver                   ./httpserver --port 8080 --host 0.0.0.0
          EOF

      - name: Package
        run: tar -C "dist/httpserver-linux-aarch64" -czf httpserver-linux-aarch64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: httpserver-linux-aarch64
          path: httpserver-linux-aarch64.tar.gz
          if-no-files-found: error

  build-macos-arm64:
    name: Build — macOS (arm64)
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o m31.tar.gz \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-macos-arm64.tar.gz"
          mkdir -p m31
          tar -C m31 -xzf m31.tar.gz
          chmod +x m31/m31c
          echo "LANGC=$PWD/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$PWD/m31" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          OUT=dist/httpserver-macos-arm64
          mkdir -p "$OUT"
          OUT="$OUT/httpserver" bash build.sh
          cp README.md BENCHMARK.md SCALING.md "$OUT/" 2>/dev/null || true
          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          httpserver — macOS arm64 (Apple Silicon) release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}
          Built against m31 ${{ env.M31_REF }}

          httpserver                   ./httpserver --port 8080 --host 0.0.0.0
          EOF

      - name: Package
        run: tar -C "dist/httpserver-macos-arm64" -czf httpserver-macos-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: httpserver-macos-arm64
          path: httpserver-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - test
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
